[window]
decorations = "None"
dynamic_padding = false
dynamic_title = true
opacity = 1.0
startup_mode = "Windowed"

[window.class]
general = "alacritty"
instance = "alacritty-tty"

[window.dimensions]
columns = 0
lines = 0

[window.padding]
x = 10
y = 10

[scrolling]
history = 10000
multiplier = 5

[font]
builtin_box_drawing = true

[cursor]
blink_interval = 750
thickness = 1.0
unfocused_hollow = true
vi_mode_style = "None"

[cursor.style]
blinking = "On"
shape = "Block"

[selection]
save_to_clipboard = true

[terminal]
osc52 = "Disabled"

[mouse]
hide_when_typing = true

[debug]
log_level = "Warn"

[colors.primary]
background = "#2E3440"
foreground = "#D8DEE9"
dim_foreground = "#A5AAAF"

[colors.cursor]
text = "#2E3440"
cursor = "#D8DEE9"

[colors.selection]
text = "CellForeground"
background = "#4C566A"

[colors.normal]
black   = "#3B4252"
red     = "#BF616A"
green   = "#A3BE8C"
yellow  = "#EBCB8B"
blue    = "#81A1C1"
magenta = "#B48EAD"
cyan    = "#88C0D0"
white   = "#E5E9F0"

[colors.bright]
black   = "#4C566A"
red     = "#BF616A"
green   = "#A3BE8C"
yellow  = "#EBCB8B"
blue    = "#81A1C1"
magenta = "#B48EAD"
cyan    = "#8FBCBB"
white   = "#ECEFF4"
