[org/gnome/desktop/interface]
gtk-theme='Nordic'
color-scheme='prefer-dark'
accent-color='teal'
cursor-theme='volantes_cursors'
enable-hot-corners=false

[org/gnome/desktop/input-sources]
sources=[('xkb', 'us'), ('xkb', 'ru')]

[org/gnome/desktop/session]
idle-delay=uint32 0

[org/gnome/settings-daemon/plugins/power]
sleep-inactive-ac-type='nothing'

[org/gnome/shell]
enabled-extensions=['user-theme@gnome-shell-extensions.gcampax.github.com', 'just-perfection-desktop@just-perfection']
favorite-apps=['firefox.desktop', 'code.desktop', 'org.gnome.Console.desktop', 'org.telegram.desktop.desktop', 'org.gnome.Nautilus.desktop', 'steam.desktop', 'AmneziaVPN.desktop']

[org/gnome/shell/extensions/user-theme]
name='Nordic'