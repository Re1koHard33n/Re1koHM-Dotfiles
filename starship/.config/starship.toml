add_newline = true
format = "$username$hostname$directory$git_branch$git_status$golang$c$python$cmd_duration$line_break$character"

[character]
success_symbol = "[❯](bold #A3BE8C)"
error_symbol = "[❯](bold #BF616A)"

[username]
style_user = "bold #81A1C1"
style_root = "bold #BF616A"
format = "[$user]($style)"
show_always = true

[hostname]
ssh_only = false
ssh_symbol = "󰣀"
format = "@[$ssh_symbol$hostname](bold #EBCB8B) "
trim_at = "."

[directory]
style = "bold #88C0D0"
format = "at [$path]($style)[$read_only]($read_only_style) "
read_only = ""
read_only_style = "#BF616A"
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = true
home_symbol = "~"

[git_branch]
symbol = ""
format = "in [$symbol$branch]($style)"
style = "bold #B48EAD"

[git_status]
format = "([$all_status$ahead_behind]($style))"
style = "bold #BF616A"
conflicted = "="
ahead = "⇡"
behind = "⇣"
diverged = "⇕"
untracked = "?"
modified = "!"
staged = "+"
deleted = "✘"

[golang]
symbol = "󰟓"
format = " [$symbol$version]($style) "
style = "#8FBCBB"

[c]
symbol = ""
format = " [$symbol$version]($style) "
style = "#81A1C1"

[python]
symbol = ""
format = " [$symbol$version]($style) "
style = "#EBCB8B"

[cmd_duration]
min_time = 2000
format = " [$duration](bold #EBCB8B)"
show_milliseconds = false
